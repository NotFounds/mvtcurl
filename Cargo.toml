[package]
name = "mvtcurl"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13", features = ["blocking", "gzip"] }
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
flate2 = "1"

[build-dependencies]
prost-build = "0.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
